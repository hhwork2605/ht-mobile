# Hạ tầng dev. DB chính là Supabase (cloud) → ở đây chỉ cần Redis.
# Bật profile "localdb" nếu muốn Postgres local để dev offline.
services:
  redis:
    image: redis:7-alpine
    container_name: htmobile-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  # Tuỳ chọn: chạy `docker compose --profile tools up -d` để có pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: htmobile-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@htmobile.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    restart: unless-stopped

  # Tuỳ chọn: Postgres local (dev offline) — `docker compose --profile localdb up -d`
  postgres:
    image: postgres:16-alpine
    container_name: htmobile-postgres
    profiles: ["localdb"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: htmobile
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
